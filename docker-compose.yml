services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-researchshastra}
      POSTGRES_USER: ${POSTGRES_USER:-researchshastra}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-researchshastra_dev}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - researchshastra_postgres:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-researchshastra} -d ${POSTGRES_DB:-researchshastra}",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

volumes:
  researchshastra_postgres:
